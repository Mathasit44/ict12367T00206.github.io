<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - DjangoWeb</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts - Montserrat & Lato -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --accent-color: #818cf8;
            --text-color: #1e293b;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --dark-bg: #0f172a;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        /* Navbar Styles */
        .navbar {
            background-color: var(--white);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 12px 0;
        }

        .navbar-brand {
            color: var(--primary-color) !important;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-link {
            color: var(--text-color) !important;
            font-weight: 500;
            margin: 0 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary-color) !important;
            transform: translateY(-2px);
        }

        .nav-btn {
            border-radius: 8px;
            padding: 8px 16px;
            margin-left: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-login {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color) !important;
        }

        .btn-login:hover {
            background-color: rgba(99, 102, 241, 0.1);
        }

        .btn-signup {
            background-color: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: var(--white) !important;
        }

        .btn-signup:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        /* Login Form */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .login-card {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 30px;
            text-align: center;
            color: var(--white);
        }

        .login-header h2 {
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-header p {
            opacity: 0.9;
            margin-bottom: 0;
        }

        .login-body {
            padding: 30px;
        }

        .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: #475569;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .form-check-label {
            color: #64748b;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .divider span {
            padding: 0 10px;
            color: #64748b;
            font-size: 0.875rem;
        }

        .social-login {
            display: flex;
            gap: 15px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }

        .social-btn i {
            font-size: 1.25rem;
            margin-right: 8px;
        }

        .social-btn.facebook i {
            color: #1877f2;
        }

        .social-btn.google i {
            color: #ea4335;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #64748b;
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: var(--dark-bg);
            color: var(--white);
            padding: 20px 0;
            margin-top: auto;
        }

        .footer-bottom {
            text-align: center;
            color: #94a3b8;
            font-size: 0.875rem;
        }

        /* Responsive Fixes */
        @media (max-width: 768px) {
            .navbar-collapse {
                background-color: var(--white);
                border-radius: 8px;
                padding: 15px;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                margin-top: 12px;
            }
            
            .nav-btn {
                margin: 8px 0;
                display: block;
                text-align: center;
            }

            .login-card {
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Django<span style="color: var(--accent-color);">Web</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="#">หน้าหลัก</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">สินค้า</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">เกี่ยวกับเรา</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">ติดต่อ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn btn-login active" href="#"><i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn btn-signup" href="#"><i class="bi bi-person-plus me-1"></i> สมัครสมาชิก</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Form Section -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>เข้าสู่ระบบ</h2>
                <p>ยินดีต้อนรับกลับมา! กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
            </div>
            <div class="login-body">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">อีเมลหรือชื่อผู้ใช้</label>
                        <div class="input-group">
                            <span class="input-group-text" id="email-addon"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="กรอกอีเมลหรือชื่อผู้ใช้" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">รหัสผ่าน</label>
                        <div class="input-group">
                            <span class="input-group-text" id="password-addon"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="กรอกรหัสผ่าน" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="remember-me">
                            <label class="form-check-label" for="remember-me">
                                จดจำฉัน
                            </label>
                        </div>
                        <div class="forgot-password">
                            <a href="#">ลืมรหัสผ่าน?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">เข้าสู่ระบบ <i class="bi bi-arrow-right-circle ms-1"></i></button>
                </form>

                <div class="divider">
                    <span>หรือเข้าสู่ระบบด้วย</span>
                </div>

                <div class="social-login">
                    <a href="#" class="social-btn facebook">
                        <i class="bi bi-facebook"></i> Facebook
                    </a>
                    <a href="#" class="social-btn google">
                        <i class="bi bi-google"></i> Google
                    </a>
                </div>

                <div class="login-footer">
                    ยังไม่มีบัญชีผู้ใช้? <a href="#">สมัครสมาชิกใหม่</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>© 2025 DjangoWeb. สงวนลิขสิทธิ์ทั้งหมด.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
