<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มสินค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Prompt', sans-serif;
        }
        .form-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .form-title {
            color: #3c6382;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #3c6382;
        }
        .form-label {
            font-weight: 500;
            color: #2c3e50;
        }
        .btn-submit {
            background-color: #3c6382;
            border: none;
            padding: 10px 30px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            background-color: #2c3e50;
            transform: translateY(-2px);
        }
        .preview-container {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            display: none;
        }
        .icon-container {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h2 class="text-center form-title">
                        <i class="fas fa-plus-circle me-2"></i>เพิ่มสินค้าใหม่
                    </h2>
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Product Name -->
                        <div class="mb-4">
                            <label for="name" class="form-label">
                                <span class="icon-container"><i class="fas fa-tag"></i></span>ชื่อสินค้า
                            </label>
                            {{ form.name }}
                        </div>
                        
                        <!-- Product Price -->
                        <div class="mb-4">
                            <label for="price" class="form-label">
                                <span class="icon-container"><i class="fas fa-baht-sign"></i></span>ราคา
                            </label>
                            {{ form.price }}
                        </div>
                        
                        <!-- Product Quantity -->
                        <div class="mb-4">
                            <label for="quantity" class="form-label">
                                <span class="icon-container"><i class="fas fa-cogs"></i></span>จำนวนสินค้า
                            </label>
                            {{ form.quantity }}
                        </div>
                        
                        <!-- Product Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label">
                                <span class="icon-container"><i class="fas fa-align-left"></i></span>รายละเอียดสินค้า
                            </label>
                            {{ form.description }}
                        </div>
                        
                        <!-- Product Image -->
                        <div class="mb-4">
                            <label for="image" class="form-label">
                                <span class="icon-container"><i class="fas fa-image"></i></span>อัปโหลดรูปสินค้า
                            </label>
                            <div class="preview-container">
                                <img id="preview" class="preview-image" alt="ตัวอย่างรูปภาพ" src="/api/placeholder/400/320">
                                <div id="upload-placeholder">
                                    <i class="fas fa-cloud-upload-alt fa-3x mb-3" style="color: #adb5bd;"></i>
                                    <p>ลากไฟล์มาที่นี่หรือคลิกเพื่อเลือกรูปภาพ</p>
                                </div>
                            </div>
                            {{ form.image }}
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary me-md-2">
                                <i class="fas fa-times me-1"></i>ยกเลิก
                            </a>
                            <button type="submit" class="btn btn-submit">
                                <i class="fas fa-save me-2"></i>บันทึกสินค้า
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Image preview functionality
        document.getElementById('id_image').addEventListener('change', function(event) {
            const preview = document.getElementById('preview');
            const placeholder = document.getElementById('upload-placeholder');
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
